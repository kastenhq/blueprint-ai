# Pattern 5 — S3 keeper for Elasticsearch S3 snapshot repository
#
# The keeper runs RustFS, an S3-compatible server: the MinIO images can no longer
# be pulled (Docker Hub and quay.io deny the pull). The resource names keep
# "minio" so existing bindings and the blueprint's "<workload>-minio" naming
# convention keep working.
#
# The Secret holds two pairs of keys:
#   - rootUser/rootPassword              → consumed by RustFS as RUSTFS_ACCESS_KEY/SECRET_KEY
#   - s3.client.default.access_key/secret_key → loaded into the Elasticsearch
#                                          keystore via ECK secureSettings (same values)
apiVersion: v1
kind: Secret
metadata:
  name: es-cluster-minio-creds
  namespace: elasticsearch-eck-minio
type: Opaque
stringData:
  rootUser: minioadmin
  rootPassword: minioadminpassword
  s3.client.default.access_key: minioadmin
  s3.client.default.secret_key: minioadminpassword
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: es-cluster-minio
  namespace: elasticsearch-eck-minio
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ebs-sc
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: es-cluster-minio
  namespace: elasticsearch-eck-minio
  labels:
    app: es-cluster-minio
    minio-s3-keeper: "true"
    kasten.io/workload-name: es-cluster
    kasten.io/workload-kind: Elasticsearch
spec:
  replicas: 1
  # RWO PVC: the old pod must release the volume before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: es-cluster-minio
  template:
    metadata:
      labels:
        app: es-cluster-minio
    spec:
      # RustFS runs as uid/gid 10001: fsGroup makes the PVC writable for it.
      securityContext:
        fsGroup: 10001
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.7
          args:
            - /data
          env:
            - name: RUSTFS_ADDRESS
              value: "0.0.0.0:9000"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "false"
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: es-cluster-minio-creds
                  key: rootUser
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: es-cluster-minio-creds
                  key: rootPassword
          ports:
            - containerPort: 9000
              name: api
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
        # Sidecar — blueprint phases KubeExec into this container. It uses the
        # Kanister tools image because the phases need kando (to emit the
        # output artifact) as well as curl and sync. sync flushes every
        # filesystem of the node, the keeper PVC included.
        - name: tools
          image: gcr.io/kasten-images/kanister-tools:9.0.11
          command: ["sleep", "infinity"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: es-cluster-minio
---
apiVersion: v1
kind: Service
metadata:
  name: es-cluster-minio
  namespace: elasticsearch-eck-minio
spec:
  selector:
    app: es-cluster-minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
