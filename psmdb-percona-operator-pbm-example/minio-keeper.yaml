apiVersion: v1
kind: Secret
metadata:
  name: my-psmdb-psmdb-db-minio-creds
  namespace: psmdb-test
type: Opaque
stringData:
  rootUser: minioadmin
  rootPassword: minioadmin123
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin123
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: my-psmdb-psmdb-db-minio
  namespace: psmdb-test
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ebs-sc
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-psmdb-psmdb-db-minio
  namespace: psmdb-test
  labels:
    app: my-psmdb-psmdb-db-minio
    psmdb-minio: "true"
spec:
  replicas: 1
  # RWO PVC: the old pod must release the volume before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: my-psmdb-psmdb-db-minio
  template:
    metadata:
      labels:
        app: my-psmdb-psmdb-db-minio
    spec:
      # RustFS runs as uid/gid 10001: fsGroup makes the PVC writable for it.
      securityContext:
        fsGroup: 10001
      containers:
        # S3 keeper. The MinIO images are no longer published (Docker Hub and
        # quay.io deny the pull), so the keeper runs RustFS, an S3-compatible
        # server. The resource names keep "minio": the blueprint derives the
        # PSMDB cluster name from the "-minio" suffix of this Deployment.
        - name: rustfs
          image: rustfs/rustfs:1.0.7
          args:
            - /data
          env:
            - name: RUSTFS_ADDRESS
              value: "0.0.0.0:9000"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "false"
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: my-psmdb-psmdb-db-minio-creds
                  key: rootUser
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: my-psmdb-psmdb-db-minio-creds
                  key: rootPassword
          ports:
            - containerPort: 9000
              name: api
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: my-psmdb-psmdb-db-minio
---
apiVersion: v1
kind: Service
metadata:
  name: my-psmdb-psmdb-db-minio
  namespace: psmdb-test
spec:
  selector:
    app: my-psmdb-psmdb-db-minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
