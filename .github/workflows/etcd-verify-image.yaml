name: etcd-verify image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ocp-etcd-backup-hosted-control-plane-example/images/etcd-verify/**"
  push:
    branches:
      - main
    paths:
      - "ocp-etcd-backup-hosted-control-plane-example/images/etcd-verify/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/etcd-verify

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@9bb56186c3b09b4f86b1c65136769dd318469633 # v4.1.2

      - name: Extract version tag from Dockerfile
        id: versions
        run: |
          # Use the etcd source image tag as the version identifier
          etcd_tag=$(grep -oP '(?<=ARG ETCD_SOURCE_IMAGE=quay.io/coreos/etcd:)\S+' ocp-etcd-backup-hosted-control-plane-example/images/etcd-verify/Dockerfile)
          echo "etcd_tag=${etcd_tag}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=${{ steps.versions.outputs.etcd_tag }},enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@68827325e0b33c7199eb31dd4e31fbe9023e06e3 # v3.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@2b51285047da1547ffb1b2203d8be4c0af6b1f20 # v3.2.0

      - name: Login to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@e92390c5fb421da1463c202d546fed0ec5c39f20 # v3.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@2cdde995de11925a030ce8070c3d77a52ffcf1c0 # v5.3.0
        with:
          context: ocp-etcd-backup-hosted-control-plane-example/images/etcd-verify
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
