apiVersion: cr.kanister.io/v1alpha1
kind: Blueprint
metadata:
  name: aerospike-absctl-blueprint
  namespace: kasten-io
# ---------------------------------------------------------------------------
# Pattern 4 — Database dump on a permanent Keeper PVC, using absctl.
# 
# WHY NOT SNAPSHOT THE AEROSPIKE VOLUMES
#   Aerospike stores namespace data on RAW BLOCK devices, one PVC per pod, and
#   each node holds only its own subset of the 4096 partitions. An individual PVC
#   snapshot IS crash-consistent within that one volume, but that is not enough:
#     - No cross-volume/cross-node consistency. Aerospike's own docs state that
#       snapshots are "consistent within a volume, but may not be consistent
#       between volumes"; a 3-node namespace needs 6 volumes (nsdata + workdir)
#       cut at the same instant, which plain CSI VolumeSnapshot does not provide.
#     - Crash-consistent != no acknowledged writes lost. Writes sit in an 8MiB
#       streaming write buffer until it fills or flush-max-ms expires, so a block
#       snapshot cannot see them without commit-to-device.
#     - System metadata (SMD) lives on the workdir volume and Aerospike documents
#       it as NOT covered by snapshot-based backup.
#   So the Aerospike device PVCs are EXCLUDED from the policy and absctl produces
#   a logical dump onto a permanent keeper PVC that Kasten snapshots instead.
#
# WHY absctl AND NOT THE AEROSPIKE BACKUP SERVICE
#   ABS owns cron schedules and retention. Inside a Kasten blueprint that means
#   two schedulers and two retention regimes over the same bytes. absctl is the
#   primitive: one invocation, one backup, no opinions about time. Kasten owns
#   frequency and retention, exclusively.
#
# FULL DUMP EVERY RUN
#   Each run rewrites the dump in place (--remove-files). Consequences:
#     - no chain, no chain state, nothing to prune
#     - every restore point is self-contained
#     - deleted records can NEVER be resurrected (there is no incremental chain)
#     - the namespace list is discovered from the live cluster, so a namespace
#       cannot be silently left unprotected
#   The apparent cost — rewriting the dump every run — is largely absorbed by
#   Kasten's content-addressed Kopia export. That is measured, not assumed:
#   see "Export deduplication" in README.md.
#
# EVERYTHING IS DISCOVERED, NOTHING IS CONFIGURED
#   - keeper pod          : <StatefulSet name>-0 (deterministic, no discovery)
#   - Aerospike server pod: label app=aerospike-cluster in the same namespace
#   - seed host           : the aerospike.com/cr label on those pods gives the
#                           AerospikeCluster name, which is also its headless
#                           Service name
#   - Aerospike namespaces: asinfo -v namespaces (backup) / the directories
#                           present on the keeper PVC (restore)
#   There is no ConfigMap, no annotation and no hardcoded hostname to drift.
#
# ONE IMAGE
#   ghcr.io/kastenhq/blueprint-ai/kasten-tools:9.0.4 provides kubectl, jq and
#   kando. Phases run as KubeTask in kasten-io so they inherit the Kanister
#   service account, which has the cross-namespace pods/exec permission this
#   design needs. absctl lives in the keeper pod and asinfo in the Aerospike
#   server pods; both are reached with kubectl exec, so no custom image is built
#   and no tool is duplicated.
# ---------------------------------------------------------------------------
actions:

  # =========================================================================
  # backupPrehook — runs BEFORE Kasten snapshots the keeper PVC.
  # Produces a complete logical dump of every Aerospike namespace.
  # =========================================================================
  backupPrehook:
    outputArtifacts:
      aerospikeBackup:
        keyValue:
          keeper: "{{ .Phases.absctlBackup.Output.keeper }}"
          namespace: "{{ .Phases.absctlBackup.Output.namespace }}"
          cluster: "{{ .Phases.absctlBackup.Output.cluster }}"
          namespaces: "{{ .Phases.absctlBackup.Output.namespaces }}"
          dumpKiB: "{{ .Phases.absctlBackup.Output.dumpKiB }}"
          summary: "{{ .Phases.absctlBackup.Output.summary }}"
    phases:
      - func: KubeTask
        name: absctlBackup
        args:
          namespace: kasten-io
          image: ghcr.io/kastenhq/blueprint-ai/kasten-tools:9.0.4
          command:
            - bash
            - -o
            - errexit
            - -o
            - pipefail
            - -c
            - |
              # Disable pathname expansion: namespace names are word-split below
              # and must never be treated as globs.
              set -f

              KEEPER="{{ .Object.metadata.name }}"
              NS="{{ .Object.metadata.namespace }}"
              POD="${KEEPER}-0"

              echo "Keeper StatefulSet=${KEEPER} pod=${POD} namespace=${NS}"

              # --- Wait for the keeper pod ---------------------------------
              # Poll rather than `kubectl wait`: wait errors out immediately if
              # the pod does not exist YET, which happens whenever the keeper
              # StatefulSet pod is being (re)created.
              echo "Waiting for keeper pod ${POD} to be ready (timeout 5m)..."
              ELAPSED=0
              while [ "${ELAPSED}" -lt 300 ]; do
                READY=$(kubectl get pod "${POD}" -n "${NS}" \
                  -o jsonpath='{.status.containerStatuses[0].ready}' 2>/dev/null || true)
                [ "${READY}" = "true" ] && break
                sleep 5; ELAPSED=$((ELAPSED + 5))
              done
              if [ "${READY}" != "true" ]; then
                echo "ERROR: keeper pod ${POD} did not become ready within 5m."
                echo "The keeper is a StatefulSet, so its pod name is <name>-0."
                kubectl get pods -n "${NS}" -l app=aerospike-backup-keeper || true
                exit 1
              fi
              echo "Keeper pod ready."

              # --- Discover the Aerospike cluster --------------------------
              # AKO labels every server pod app=aerospike-cluster and records the
              # AerospikeCluster name in aerospike.com/cr. That CR name is also
              # the name of the headless Service, which is the seed host.
              SRV_POD=$(kubectl get pods -n "${NS}" -l app=aerospike-cluster \
                -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.containerStatuses[0].ready}{"\n"}{end}' \
                | awk '$2=="true"{print $1; exit}')
              if [ -z "${SRV_POD}" ]; then
                echo "ERROR: no ready Aerospike server pod found in ${NS} (label app=aerospike-cluster)."
                exit 1
              fi
              CR=$(kubectl get pod "${SRV_POD}" -n "${NS}" \
                -o jsonpath='{.metadata.labels.aerospike\.com/cr}')
              if [ -z "${CR}" ]; then
                echo "ERROR: pod ${SRV_POD} has no aerospike.com/cr label; cannot derive the seed host."
                exit 1
              fi
              SEED="${CR}.${NS}.svc.cluster.local"
              echo "Aerospike server pod=${SRV_POD} cluster=${CR} seed=${SEED}:3000"

              # --- Discover the Aerospike namespaces ----------------------
              # Read from the live cluster, so a namespace added to the database
              # is protected automatically with no configuration change.
              NAMESPACES=$(kubectl exec -n "${NS}" "${SRV_POD}" -c aerospike-server -- \
                asinfo -v namespaces | tr -d '\r' | tr ';' ' ')
              if [ -z "${NAMESPACES// /}" ]; then
                echo "ERROR: asinfo reported no Aerospike namespaces on ${CR}."
                exit 1
              fi
              echo "Aerospike namespaces to back up: ${NAMESPACES}"

              # --- Dump each namespace ------------------------------------
              # --remove-files replaces the previous dump in place, so the PVC
              # holds exactly one complete dump per namespace and the file paths
              # are stable across runs (which is what lets Kopia deduplicate).
              # --- Incremental chain length, read from the RUNNING keeper ---
              MAXINCR=$(kubectl exec -n "${NS}" "${POD}" -c absctl -- \
                sh -c 'printenv ABSCTL_INCREMENTALS_BEFORE_FULL 2>/dev/null || echo 0' \
                | tr -d '\r ')
              case "${MAXINCR}" in
                ''|*[!0-9]*) MAXINCR=0 ;;
              esac
              echo "Incrementals before a forced full: ${MAXINCR} (0 = always full)"

              # One UTC stamp for this whole run. Sortable, no colons, and
              # convertible to absctl's --modified-after format.
              STAMP=$(kubectl exec -n "${NS}" "${POD}" -c absctl -- \
                date -u +%Y%m%dT%H%M%SZ | tr -d '\r ')
              echo "Run stamp: ${STAMP}"

              # 20260826T094950Z -> 2026-08-26_09:49:50
              stamp_to_absctl() {
                echo "$1" | sed -E 's/^([0-9]{4})([0-9]{2})([0-9]{2})T([0-9]{2})([0-9]{2})([0-9]{2})Z$/\1-\2-\3_\4:\5:\6/'
              }

              TOTAL_KIB=0
              SUMMARY=""

              for ASNS in ${NAMESPACES}; do
                echo "--------------------------------------------------------"
                echo "Namespace ${ASNS}"

                # --- Derive the chain state from the PVC ------------------
                # The directory names ARE the chain state: no marker file, no
                # external database. full-<stamp> and incr-<stamp> sort
                # chronologically, so the newest full plus the incrementals
                # after it is the current chain.
                DIRS=$(kubectl exec -n "${NS}" "${POD}" -c absctl -- \
                  sh -c "ls -1 /backup/${ASNS} 2>/dev/null || true" \
                  | tr -d '\r' | grep -E '^(full|incr)-[0-9]{8}T[0-9]{6}Z$' | sort || true)
                NEWEST_FULL=$(echo "${DIRS}" | grep '^full-' | tail -1 || true)
                NEWEST_ANY=$(echo "${DIRS}" | tail -1 || true)

                if [ -z "${NEWEST_FULL}" ]; then
                  KIND="full"
                  echo "No full backup on the volume -> FULL"
                else
                  FULLSTAMP="${NEWEST_FULL#full-}"
                  # `|| true` is essential: with errexit+pipefail a grep that
                  # matches nothing (a chain with no incrementals yet) would
                  # otherwise abort the whole phase.
                  INCRS=$(echo "${DIRS}" | { grep '^incr-' || true; } \
                    | awk -v f="${FULLSTAMP}" '{ s=$0; sub(/^incr-/,"",s); if (s > f) print }' | wc -l | tr -d ' ')
                  echo "Newest full=${NEWEST_FULL}, incrementals since it=${INCRS}, limit=${MAXINCR}"
                  if [ "${INCRS}" -ge "${MAXINCR}" ]; then
                    KIND="full"
                    echo "Chain limit reached -> FULL (and prune)"
                  else
                    KIND="incr"
                  fi
                fi

                NEWDIR="${KIND}-${STAMP}"
                MODAFTER=""
                if [ "${KIND}" = "incr" ]; then
                  MODAFTER=$(stamp_to_absctl "${NEWEST_ANY#*-}")
                  echo "INCREMENTAL since ${MODAFTER} -> /backup/${ASNS}/${NEWDIR}"
                else
                  echo "FULL -> /backup/${ASNS}/${NEWDIR}"
                fi

                # Pre-create the directory. absctl writes NOTHING - not even the
                # directory - when an incremental finds no changed records, so
                # without this the chain counter would never advance and the
                # forced full would never trigger.
                kubectl exec -n "${NS}" "${POD}" -c absctl -- mkdir -p "/backup/${ASNS}/${NEWDIR}"

                if [ "${KIND}" = "incr" ]; then
                  OUT=$(kubectl exec -n "${NS}" "${POD}" -c absctl -- \
                    absctl backup --host "${SEED}" --port 3000 \
                      --namespace "${ASNS}" --directory "/backup/${ASNS}/${NEWDIR}" \
                      --modified-after "${MODAFTER}" --parallel 4 2>&1)
                else
                  OUT=$(kubectl exec -n "${NS}" "${POD}" -c absctl -- \
                    absctl backup --host "${SEED}" --port 3000 \
                      --namespace "${ASNS}" --directory "/backup/${ASNS}/${NEWDIR}" \
                      --parallel 4 2>&1)
                fi
                echo "${OUT}" | grep -E 'Records Read|Bytes Written|Files Written|Duration' || true
                RECS=$(echo "${OUT}"  | awk '/Records Read:/{print $3; exit}')
                WROTE=$(echo "${OUT}" | awk '/Bytes Written:/{print $3; exit}')
                [ -z "${RECS}" ]  && RECS=0
                [ -z "${WROTE}" ] && WROTE=0

                # --- FLUSH THE PAGE CACHE — DO NOT REMOVE ------------------
                # A CSI/EBS snapshot captures the BLOCK DEVICE and bypasses the
                # OS page cache. absctl returns as soon as its writes are in
                # cache, so without this sync the snapshot can capture .asb
                # files as ZERO LENGTH: a restore point that looks healthy,
                # exports almost nothing and restores no data at all.
                kubectl exec -n "${NS}" "${POD}" -c absctl -- sync
                sleep 3

                # --- Verify what absctl claimed is actually on the device ---
                # Comparing absctl's reported byte count against the on-disk sum
                # detects the un-synced case precisely, and does not
                # misinterpret a legitimately empty incremental (0 records ->
                # 0 files) as a failure.
                ONDISK=$(kubectl exec -n "${NS}" "${POD}" -c absctl -- \
                  sh -c "find /backup/${ASNS}/${NEWDIR} -type f -name '*.asb' -exec cat {} + 2>/dev/null | wc -c" \
                  | tr -d '\r ')
                [ -z "${ONDISK}" ] && ONDISK=0
                echo "absctl reported ${WROTE} bytes, on device after sync: ${ONDISK} bytes"
                if [ "${WROTE}" -gt 0 ] && [ "${ONDISK}" -eq 0 ]; then
                  echo "ERROR: absctl wrote ${WROTE} bytes but the device holds 0 — the sync did not take effect."
                  kubectl exec -n "${NS}" "${POD}" -c absctl -- ls -l "/backup/${ASNS}/${NEWDIR}" || true
                  exit 1
                fi
                if [ "${KIND}" = "full" ] && [ "${RECS}" -eq 0 ]; then
                  echo "ERROR: a FULL backup of ${ASNS} captured 0 records."
                  exit 1
                fi

                # --- Prune superseded chain members after a full -----------
                # Only after the new full is verified on the device. Pruning the
                # live volume never affects existing restore points, which are
                # immutable snapshots.
                if [ "${KIND}" = "full" ]; then
                  for D in ${DIRS}; do
                    [ "${D}" = "${NEWDIR}" ] && continue
                    echo "  pruning superseded ${D}"
                    kubectl exec -n "${NS}" "${POD}" -c absctl -- rm -rf "/backup/${ASNS}/${D}"
                  done
                  kubectl exec -n "${NS}" "${POD}" -c absctl -- sync
                fi

                KIB=$(kubectl exec -n "${NS}" "${POD}" -c absctl -- \
                  sh -c "du -sk /backup/${ASNS} | cut -f1" | tr -d '\r ')
                echo "OK: ${ASNS} ${KIND} — ${RECS} records, namespace total now ${KIB} KiB"
                TOTAL_KIB=$((TOTAL_KIB + KIB))
                SUMMARY="${SUMMARY}${ASNS}:${KIND}:${RECS}recs "
              done

              echo "--------------------------------------------------------"
              echo "Chain state on the keeper PVC:"
              kubectl exec -n "${NS}" "${POD}" -c absctl -- \
                sh -c 'for d in /backup/*/; do echo "  $d"; ls -1 "$d" 2>/dev/null | sed "s/^/    /"; done' || true
              echo "Total on the keeper PVC: ${TOTAL_KIB} KiB"
              echo "Summary: ${SUMMARY}"
              echo "Keeper PVC is synced and ready for the Kasten snapshot."

              kando output keeper     "${KEEPER}"
              kando output namespace  "${NS}"
              kando output cluster    "${CR}"
              kando output namespaces "${NAMESPACES}"
              kando output dumpKiB    "${TOTAL_KIB}"
              kando output summary    "${SUMMARY}"

  # =========================================================================
  # restorePosthook — runs AFTER Kasten restores the keeper PVC and metadata.
  #
  # absctl restore is ADDITIVE: it writes records from the dump into the target
  # namespace but never removes records that exist in the target and are absent
  # from the dump (--replace/--unique/--no-generation all govern per-record
  # overwrite only; there is no truncate option). Restoring into a namespace that
  # still holds data would therefore leave stale records behind, including ones
  # that were deliberately deleted. So: TRUNCATE, then restore.
  # =========================================================================
  restorePosthook:
    phases:
      - func: KubeTask
        name: absctlRestore
        args:
          namespace: kasten-io
          image: ghcr.io/kastenhq/blueprint-ai/kasten-tools:9.0.4
          command:
            - bash
            - -o
            - errexit
            - -o
            - pipefail
            - -c
            - |
              set -f

              KEEPER="{{ .Object.metadata.name }}"
              NS="{{ .Object.metadata.namespace }}"
              POD="${KEEPER}-0"

              echo "Keeper StatefulSet=${KEEPER} pod=${POD} namespace=${NS}"

              # --- Wait for the restored keeper pod -----------------------
              # It has to be rescheduled and remount the restored PVC, so allow
              # a generous timeout here.
              # Poll rather than `kubectl wait`: during a restore the keeper
              # StatefulSet and its PVC are recreated, so the pod frequently does
              # not exist yet and `kubectl wait` would fail instantly.
              echo "Waiting for keeper pod ${POD} to be ready (timeout 10m)..."
              ELAPSED=0
              while [ "${ELAPSED}" -lt 600 ]; do
                READY=$(kubectl get pod "${POD}" -n "${NS}" \
                  -o jsonpath='{.status.containerStatuses[0].ready}' 2>/dev/null || true)
                [ "${READY}" = "true" ] && break
                sleep 10; ELAPSED=$((ELAPSED + 10))
              done
              if [ "${READY}" != "true" ]; then
                echo "ERROR: restored keeper pod ${POD} did not become ready within 10m."
                kubectl get pods -n "${NS}" -l app=aerospike-backup-keeper || true
                exit 1
              fi
              echo "Keeper pod ready."

              # --- What is actually IN the restored dump? -----------------
              # Enumerate from the PVC, not from the live cluster: the dump is
              # the source of truth for what can be restored.
              NAMESPACES=$(kubectl exec -n "${NS}" "${POD}" -c absctl -- \
                sh -c 'ls -1 /backup 2>/dev/null | grep -v "^lost+found$" || true' \
                | tr -d '\r' | tr '\n' ' ')
              if [ -z "${NAMESPACES// /}" ]; then
                echo "ERROR: the restored keeper PVC contains no namespace dumps under /backup."
                kubectl exec -n "${NS}" "${POD}" -c absctl -- ls -la /backup || true
                exit 1
              fi
              echo "Namespaces present in the dump: ${NAMESPACES}"

              # --- PRE-FLIGHT: resolve and validate every chain BEFORE the DB ---
              # Ordering matters enormously. The restore truncates each namespace
              # before repopulating it, so a problem discovered mid-loop would
              # leave already-truncated namespaces EMPTY — turning a failed
              # restore into data loss. Resolve and validate everything first,
              # and abort before a single record is deleted.
              CHAINS=""
              for ASNS in ${NAMESPACES}; do
                DIRS=$(kubectl exec -n "${NS}" "${POD}" -c absctl -- \
                  sh -c "ls -1 /backup/${ASNS} 2>/dev/null || true" \
                  | tr -d '\r' | grep -E '^(full|incr)-[0-9]{8}T[0-9]{6}Z$' | sort || true)
                NEWEST_FULL=$(echo "${DIRS}" | grep '^full-' | tail -1 || true)
                if [ -z "${NEWEST_FULL}" ]; then
                  echo "ERROR: namespace ${ASNS} has no full backup on the volume — nothing restorable."
                  kubectl exec -n "${NS}" "${POD}" -c absctl -- ls -l "/backup/${ASNS}" || true
                  exit 1
                fi
                FULLSTAMP="${NEWEST_FULL#full-}"
                # The chain is the newest full plus every incremental after it,
                # in chronological order. Anything older is superseded.
                CHAIN="${NEWEST_FULL}"
                for D in $(echo "${DIRS}" | { grep '^incr-' || true; }); do
                  DS="${D#incr-}"
                  if [ "${DS}" \> "${FULLSTAMP}" ]; then CHAIN="${CHAIN},${D}"; fi
                done
                echo "  ${ASNS}: chain = ${CHAIN}"

                # A chain member must not contain zero-length .asb files: that is
                # the signature of a backup taken without a page-cache sync. An
                # EMPTY directory is fine — an incremental that found no changed
                # records legitimately writes no files.
                for D in $(echo "${CHAIN}" | tr ',' ' '); do
                  BAD=$(kubectl exec -n "${NS}" "${POD}" -c absctl -- \
                    sh -c "n=0; for f in /backup/${ASNS}/${D}/*.asb; do [ -e \"\$f\" ] || continue; [ -s \"\$f\" ] || n=\$((n+1)); done; echo \$n" \
                    | tr -d '\r ')
                  if [ "${BAD}" != "0" ]; then
                    echo "ERROR: ${ASNS}/${D} contains ${BAD} zero-length .asb file(s)."
                    echo "       This restore point is not usable — the backup was taken without a sync."
                    echo "       ABORTING BEFORE ANY TRUNCATE — no data has been touched."
                    exit 1
                  fi
                done
                CHAINS="${CHAINS}${ASNS}=${CHAIN} "
              done
              echo "Pre-flight validation passed. Chains: ${CHAINS}"

              # --- Wait for the Aerospike cluster -------------------------
              # The Aerospike device PVCs are excluded from the restore point, so
              # the cluster must already be running (a live cluster for an
              # in-place rollback, or a freshly provisioned one for DR).
              echo "Waiting for a ready Aerospike server pod (timeout 10m)..."
              SRV_POD=""
              ELAPSED=0
              while [ "${ELAPSED}" -lt 600 ]; do
                SRV_POD=$(kubectl get pods -n "${NS}" -l app=aerospike-cluster \
                  -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.containerStatuses[0].ready}{"\n"}{end}' \
                  2>/dev/null | awk '$2=="true"{print $1; exit}')
                [ -n "${SRV_POD}" ] && break
                sleep 10; ELAPSED=$((ELAPSED + 10))
              done
              if [ -z "${SRV_POD}" ]; then
                echo "ERROR: no ready Aerospike server pod after 10m. The AerospikeCluster must be"
                echo "       running before restorePosthook executes — see the DR procedure in README.md."
                exit 1
              fi
              CR=$(kubectl get pod "${SRV_POD}" -n "${NS}" \
                -o jsonpath='{.metadata.labels.aerospike\.com/cr}')
              SEED="${CR}.${NS}.svc.cluster.local"
              echo "Aerospike server pod=${SRV_POD} cluster=${CR} seed=${SEED}:3000"

              # Wait for cluster integrity so truncate reaches every node.
              ELAPSED=0
              while [ "${ELAPSED}" -lt 300 ]; do
                INTEG=$(kubectl exec -n "${NS}" "${SRV_POD}" -c aerospike-server -- \
                  asinfo -v statistics 2>/dev/null | tr ';' '\n' \
                  | grep '^cluster_integrity=' | cut -d= -f2 | tr -d '\r' || true)
                [ "${INTEG}" = "true" ] && break
                sleep 10; ELAPSED=$((ELAPSED + 10))
              done
              CSIZE=$(kubectl exec -n "${NS}" "${SRV_POD}" -c aerospike-server -- \
                asinfo -v statistics 2>/dev/null | tr ';' '\n' \
                | grep '^cluster_size=' | cut -d= -f2 | tr -d '\r' || true)
              echo "cluster_integrity=${INTEG:-unknown} cluster_size=${CSIZE:-unknown}"

              # --- Truncate, then replay the chain, per namespace ---------
              for ENTRY in ${CHAINS}; do
                ASNS="${ENTRY%%=*}"
                CHAIN="${ENTRY#*=}"
                echo "--------------------------------------------------------"
                echo "Namespace ${ASNS}, chain ${CHAIN}"

                BEFORE=$(kubectl exec -n "${NS}" "${SRV_POD}" -c aerospike-server -- \
                  asinfo -v "namespace/${ASNS}" 2>/dev/null | tr ';' '\n' \
                  | grep '^objects=' | cut -d= -f2 | tr -d '\r' || echo "n/a")
                echo "objects before truncate: ${BEFORE}"

                echo "Truncating ${ASNS} (this is what removes records absent from the backup)..."
                OUT=$(kubectl exec -n "${NS}" "${SRV_POD}" -c aerospike-server -- \
                  asinfo -v "truncate-namespace:namespace=${ASNS}" | tr -d '\r')
                echo "asinfo response: ${OUT}"
                case "${OUT}" in
                  ok|OK|ok*) : ;;
                  *) echo "ERROR: truncate of ${ASNS} failed: ${OUT}"; exit 1 ;;
                esac
                sleep 5

                # Replay OLDEST FIRST: the full, then each incremental in
                # chronological order, so a record updated several times in the
                # chain ends up at its newest version.
                for D in $(echo "${CHAIN}" | tr ',' ' '); do
                  HAS=$(kubectl exec -n "${NS}" "${POD}" -c absctl -- \
                    sh -c "ls -1 /backup/${ASNS}/${D}/*.asb 2>/dev/null | wc -l" | tr -d '\r ')
                  if [ -z "${HAS}" ] || [ "${HAS}" -eq 0 ]; then
                    echo "  ${D}: empty (incremental with no changed records) — skipping"
                    continue
                  fi
                  echo "  restoring ${D} ..."
                  # --namespace is REQUIRED on restore. The help text presents it
                  # as remapping (source-ns,destination-ns), which reads as
                  # optional, but omitting it fails with
                  #   failed to validate config: namespace is required
                  kubectl exec -n "${NS}" "${POD}" -c absctl -- \
                    absctl restore --host "${SEED}" --port 3000 \
                      --namespace "${ASNS}" \
                      --directory "/backup/${ASNS}/${D}" \
                      --parallel 4 2>&1 | grep -E 'Records Read|Inserted Records|Expired|Errors' || true
                done

                AFTER=$(kubectl exec -n "${NS}" "${SRV_POD}" -c aerospike-server -- \
                  asinfo -v "namespace/${ASNS}" 2>/dev/null | tr ';' '\n' \
                  | grep '^objects=' | cut -d= -f2 | tr -d '\r' || echo "n/a")
                echo "OK: ${ASNS} restored — objects after restore: ${AFTER}"
              done

              echo "--------------------------------------------------------"
              echo "All namespaces truncated and restored."

  # =========================================================================
  # delete — nothing external to remove.
  # =========================================================================
  delete:
    inputArtifactNames:
      - aerospikeBackup
    phases:
      - func: KubeTask
        name: absctlDelete
        args:
          namespace: kasten-io
          image: ghcr.io/kastenhq/blueprint-ai/kasten-tools:9.0.4
          command:
            - bash
            - -c
            - |
              echo "Kasten deleted the keeper PVC snapshot for this restore point."
              echo "  keeper     = {{ .ArtifactsIn.aerospikeBackup.KeyValue.keeper }}"
              echo "  namespace  = {{ .ArtifactsIn.aerospikeBackup.KeyValue.namespace }}"
              echo "  cluster    = {{ .ArtifactsIn.aerospikeBackup.KeyValue.cluster }}"
              echo "  namespaces = {{ .ArtifactsIn.aerospikeBackup.KeyValue.namespaces }}"
              echo "  dump KiB   = {{ .ArtifactsIn.aerospikeBackup.KeyValue.dumpKiB }}"
              echo ""
