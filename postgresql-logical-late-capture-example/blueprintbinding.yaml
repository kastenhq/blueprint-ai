apiVersion: config.kio.kasten.io/v1alpha1
kind: BlueprintBinding
metadata:
  name: postgresql-logical-late-capture-binding
  namespace: kasten-io
spec:
  blueprintRef:
    name: postgresql-logical-late-capture-blueprint
    namespace: kasten-io
  resources:
    matchAll:
      - type:
          operator: In
          values:
            - group: apps
              resource: statefulsets
      - labels:
          key: app.kubernetes.io/name
          operator: In
          values:
            - postgresql
      # With architecture=replication the chart also creates a read-replica StatefulSet
      # (component=read). The dump is taken from the primary only.
      - labels:
          key: app.kubernetes.io/component
          operator: In
          values:
            - primary
      # Let an explicit annotation on a specific StatefulSet win over this binding.
      - annotations:
          key: kanister.kasten.io/blueprint
          operator: DoesNotExist
